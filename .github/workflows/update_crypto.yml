name: Update Crypto Dataset on Kaggle

on:
  schedule:
    - cron: "0 0 * * *" # كل يوم مع 00:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests pandas kaggle six

      - name: Fetch latest crypto data
        run: python scripts/fetch_crypto.py

      - name: Commit & Push to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/crypto_market_daily.csv
          git commit -m "chore: update crypto dataset $(date -u +'%Y-%m-%d')" || exit 0
          git push

      - name: Push new version to Kaggle
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets version -p data -m "Daily automated update $(date -u +'%Y-%m-%d')" --dir-mode zip
